# Owner-approved publication path. Configure npm access before a manual release.
name: Publish approved package
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Enter PUBLISH after owner approval and acceptance
        required: true
        type: string
      publication_mode:
        description: Stage for personal 2FA approval, or publish with configured OIDC trust
        required: true
        type: choice
        default: stage
        options:
          - stage
          - publish
permissions:
  contents: read
concurrency:
  group: npm-release
  cancel-in-progress: false
jobs:
  build:
    if: inputs.confirmation == 'PUBLISH' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci --ignore-scripts
      - run: npm test
      - run: npm run lint
      - name: Check package publication gate
        run: node -e "if(require('./package.json').private !== false) process.exit(1)"
      - name: Pack the tested files
        run: |
          mkdir release
          npm pack --ignore-scripts --pack-destination release
          cd release
          sha256sum n8n-nodes-etermin-0.1.0.tgz > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: approved-package
          path: release/
          if-no-files-found: error
          retention-days: 7
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      # A fresh runner: no checkout, no development dependencies, no package scripts.
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: approved-package
          path: release
      - name: Verify transfer
        working-directory: release
        run: sha256sum --check SHA256SUMS
      - name: Stage for personal approval
        if: inputs.publication_mode == 'stage'
        working-directory: release
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_BOOTSTRAP_TOKEN }}
        run: |
          test -n "$NODE_AUTH_TOKEN"
          npm stage publish ./n8n-nodes-etermin-0.1.0.tgz --ignore-scripts --provenance --access public
      - name: Publish with configured OIDC trust
        if: inputs.publication_mode == 'publish'
        working-directory: release
        run: npm publish ./n8n-nodes-etermin-0.1.0.tgz --ignore-scripts --provenance --access public
